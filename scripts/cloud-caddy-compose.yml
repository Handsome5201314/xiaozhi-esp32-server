services:
  caddy:
    image: caddy:2.10
    container_name: xiaozhi-cloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    network_mode: bridge

volumes:
  caddy_data:
  caddy_config:
