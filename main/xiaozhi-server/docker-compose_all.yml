# Docker安装全模块

name: xiaozhi-server

services:
  # 管理入口：manager-api和manager-web模块
  xiaozhi-esp32-server-web:
    image: xiaozhi-esp32-server:web-v096-hermes-multitenant-20260924-hermes-save-error-fix
    container_name: xiaozhi-esp32-server-web
    restart: always
    networks:
      - default
    extra_hosts:
      - hermes-medical.internal:192.168.31.29
    depends_on:
      xiaozhi-esp32-server-db:
        condition: service_healthy
      xiaozhi-esp32-server-redis:
        condition: service_healthy
    ports:
      # 智控台
      - "8002:8002"
    environment:
      - TZ=Asia/Shanghai
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://xiaozhi-esp32-server-db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=123456
      - SPRING_DATA_REDIS_HOST=xiaozhi-esp32-server-redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
      # Only explicitly configured internal Hermes hosts are allowed.
      - XIAOZHI_HERMES_ALLOWED_HOSTS=${XIAOZHI_HERMES_ALLOWED_HOSTS:-}
    volumes:
      # 配置文件目录
      - ./uploadfile:/uploadfile

  # Server模块
  xiaozhi-esp32-server:
    image: xiaozhi-esp32-server:v0.9.6-hermes-multitenant-20260924-hermes-local-https
    container_name: xiaozhi-esp32-server
    depends_on:
      - xiaozhi-esp32-server-db
      - xiaozhi-esp32-server-redis
    restart: always
    env_file:
      - ./data/multitenant-runtime.env
    networks:
      - default
    extra_hosts:
      - hermes-medical.internal:192.168.31.29
    ports:
      # ws服务端
      - "8000:8000"
      # http服务的端口，用于视觉分析接口
      - "8003:8003"
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
      - XIAOZHI_HERMES_ALLOWED_HOSTS=${XIAOZHI_HERMES_ALLOWED_HOSTS:-}
      - XIAOZHI_HERMES_CA_CERT=/etc/xiaozhi/hermes/hermes-proxy-ca.crt
      - METALIO_KNOWLEDGE_ENABLED=${METALIO_KNOWLEDGE_ENABLED:-1}
      - METALIO_KNOWLEDGE_SOURCE_ROOT=/opt/xiaozhi-esp32-server/data/knowledge/source
      - METALIO_KNOWLEDGE_PUBLISH_ROOT=/opt/xiaozhi-esp32-server/data/knowledge/published
      - METALIO_KNOWLEDGE_PERMISSIONS_JSON=${METALIO_KNOWLEDGE_PERMISSIONS_JSON:-}
    volumes:
      # 配置文件目录
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./data/hermes-proxy/hermes-proxy-ca.crt:/etc/xiaozhi/hermes/hermes-proxy-ca.crt:ro
      # 模型文件挂接，很重要
      - ./models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt

  # 数据库模块
  xiaozhi-esp32-server-db:
    image: mysql:latest
    container_name: xiaozhi-esp32-server-db
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    networks:
      - default
    expose:
      - 3306
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=xiaozhi_esp32_server
      - MYSQL_INITDB_ARGS="--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
  # redis模块
  xiaozhi-esp32-server-redis:
    image: redis:8.0
    expose:
      - 6379
    container_name: xiaozhi-esp32-server-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
networks:
  default:
